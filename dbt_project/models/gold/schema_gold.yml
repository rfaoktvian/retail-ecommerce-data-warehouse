version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_key
        tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_key
        tests: [unique, not_null]

  - name: dim_sellers
    columns:
      - name: seller_key
        tests: [unique, not_null]

  - name: dim_geography
    columns:
      - name: geography_key
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_sales
    columns:
      - name: sales_key
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_key

  - name: fact_payments
    columns:
      - name: payment_key
        tests: [unique, not_null]

  - name: fact_reviews
    columns:
      - name: review_key
        tests: [unique, not_null]