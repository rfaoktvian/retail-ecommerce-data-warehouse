version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres-oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-retail_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-retail_pass}
      POSTGRES_DB: ${DB_NAME:-retail_oltp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/ddl_postgres_transactions.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
